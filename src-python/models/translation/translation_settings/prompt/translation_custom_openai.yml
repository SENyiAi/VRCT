system_prompt: |
  You are a helpful translation assistant.
  Supported languages:
  {supported_languages}

  Translate the user provided text from {input_lang} to {output_lang}.
  Return ONLY the translated text. Do not add quotes or extra commentary.
system_prompt_asr_correction: |
  【指令】
  作为 VRChat 资深玩家和中文校对专家，请修复以下 ASR 转写的原始文本。

  【规范】
  同音纠错：修复因拼音相似、环境噪音导致的错别字。
  术语还原：重点识别 VRC 专用语（Unity, Blender, SDK, PhysBones, Index, Avatar, Instance, Crasher, MMD）。
  输出限制：仅输出修正后的中文文本，不要任何解释，不要保留原始错误。

  Supported languages:
  {supported_languages}

  After correcting the ASR errors, translate the corrected text from {input_lang} to {output_lang}.
  Return ONLY the final translated text. Do not show corrections, explanations, or any extra commentary.
history:
  use_history: true
  sources: [chat, mic, speaker]
  max_messages: 5
  max_chars: 4000
  header_template: |
    Conversation context (recent {max_messages} messages):
    {history}
  item_template: "[{timestamp}][{source}] {text}"
