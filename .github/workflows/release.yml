name: Release VRCT

on:
  push:
    tags:
      - 'v*' # タグが 'v' で始まる場合にトリガー (例: v1.0.0)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 3.5.0)'
        required: true
        default: '3.5.0'

# ─── Job 1: resolve the version string ────────────────────────────────────────
jobs:
  get-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version string
        id: ver
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

# ─── Job 2: standard (CPU) build ──────────────────────────────────────────────
  build-standard:
    name: Build standard
    needs: get-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync package.json version from tag
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "${{ env.VERSION }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pip (standard)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-standard-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-standard-

      - name: Install Node dependencies
        run: npm install

      - name: Setup Python environment (CPU only)
        run: npm run setup-python-cpu

      - name: Install Python script dependencies
        run: pip install tqdm

      - name: Update version
        run: npm run update-version

      - name: Build standard
        run: npm run build

      - name: Create portable ZIP
        run: python utils\zip.py --zip_name VRCT.zip

      - name: Collect NSIS installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { Write-Error "NSIS installer not found"; exit 1 }
          Write-Host "Found installer: $($installer.FullName)"
          Copy-Item $installer.FullName "NSIS_INSTALLER.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-standard
          path: |
            VRCT.zip
            NSIS_INSTALLER.exe
          retention-days: 7

# ─── Job 3: CUDA build (runs in parallel with Job 2) ─────────────────────────
  build-cuda:
    name: Build CUDA
    needs: get-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync package.json version from tag
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "${{ env.VERSION }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pip (CUDA)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-cuda-${{ hashFiles('requirements_cuda.txt') }}
          restore-keys: pip-cuda-

      - name: Install Node dependencies
        run: npm install

      - name: Setup Python environment (CUDA only)
        run: npm run setup-python-cuda

      - name: Install Python script dependencies
        run: pip install tqdm

      - name: Update version
        run: npm run update-version

      - name: Build CUDA
        run: npm run build-cuda

      - name: Create portable ZIP
        run: python utils\zip.py --zip_name VRCT_cuda.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-cuda
          path: VRCT_cuda.zip
          retention-days: 7

# ─── Job 4: create GitHub Release (tag push only) ────────────────────────────
  release:
    name: Create GitHub Release
    needs: [get-version, build-standard, build-cuda]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Download standard artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-standard
          path: artifacts/standard

      - name: Download CUDA artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-cuda
          path: artifacts/cuda

      - name: Rename NSIS installer with version
        run: |
          mv artifacts/standard/NSIS_INSTALLER.exe "artifacts/standard/VRCT_${{ env.VERSION }}_x64-setup.exe"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/standard/VRCT_${{ env.VERSION }}_x64-setup.exe
            artifacts/standard/VRCT.zip
            artifacts/cuda/VRCT_cuda.zip

# ─── Job 2: standard (CPU) build ──────────────────────────────────────────────
  build-standard:
    name: Build standard
    needs: get-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache pip (standard)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-standard-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-standard-

      - name: Install Node dependencies
        run: npm install

      - name: Setup Python environment (CPU only)
        run: npm run setup-python-cpu

      - name: Install Python script dependencies
        run: pip install tqdm

      - name: Update version
        run: npm run update-version

      - name: Build standard
        run: npm run build

      - name: Create portable ZIP
        run: python utils\zip.py --zip_name VRCT.zip

      - name: Prepare NSIS installer artifact
        shell: pwsh
        run: |
          Copy-Item "src-tauri/target/release/bundle/nsis/VRCT_${{ env.VERSION }}_x64-setup.exe" "NSIS_INSTALLER.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-standard
          path: |
            VRCT.zip
            NSIS_INSTALLER.exe
          retention-days: 1

# ─── Job 3: CUDA build (runs in parallel with Job 2) ─────────────────────────
  build-cuda:
    name: Build CUDA
    needs: get-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache pip (CUDA)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-cuda-${{ hashFiles('requirements_cuda.txt') }}
          restore-keys: pip-cuda-

      - name: Install Node dependencies
        run: npm install

      - name: Setup Python environment (CUDA only)
        run: npm run setup-python-cuda

      - name: Install Python script dependencies
        run: pip install tqdm

      - name: Update version
        run: npm run update-version

      - name: Build CUDA
        run: npm run build-cuda

      - name: Create portable ZIP
        run: python utils\zip.py --zip_name VRCT_cuda.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-cuda
          path: VRCT_cuda.zip
          retention-days: 1

# ─── Job 4: create release (only on tag pushes) ───────────────────────────────
  release:
    name: Create Release
    needs: [get-version, build-standard, build-cuda]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Download standard artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-standard
          path: artifacts/standard

      - name: Download CUDA artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-cuda
          path: artifacts/cuda

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub==0.34.4
          UPLOAD_DIR="./hf_upload_temp"
          mkdir -p "$UPLOAD_DIR"
          cp artifacts/standard/VRCT.zip "$UPLOAD_DIR/VRCT.zip"
          cp artifacts/cuda/VRCT_cuda.zip "$UPLOAD_DIR/VRCT_cuda.zip"
          hf upload --repo-type model --commit-message "👍️[Update] ${{ env.VERSION }} Release" ms-software/VRCT "$UPLOAD_DIR"
          hf repo tag create ms-software/VRCT ${{ github.ref_name }} --repo-type model --message "Release ${{ github.ref_name }}"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ env.VERSION }}
          draft: false
          prerelease: false

      - name: Upload NSIS Installer to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/standard/NSIS_INSTALLER.exe
          asset_name: VRCT_${{ env.VERSION }}_x64-setup.exe
          asset_content_type: application/octet-stream

      - name: Upload standard ZIP to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/standard/VRCT.zip
          asset_name: VRCT.zip
          asset_content_type: application/zip

      - name: Upload CUDA ZIP to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/cuda/VRCT_cuda.zip
          asset_name: VRCT_cuda.zip
          asset_content_type: application/zip
