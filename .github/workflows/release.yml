name: Release VRCT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 3.5.0)'
        required: true
        default: '3.5.0'

# ─── Job 1: resolve the version string ────────────────────────────────────────
jobs:
  get-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version string
        id: ver
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

# ─── Job 2: standard (CPU) build ──────────────────────────────────────────────
  build-standard:
    name: Build standard
    needs: get-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync package.json version from tag
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "${{ env.VERSION }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pip (standard)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-standard-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-standard-

      - name: Install Node dependencies
        run: npm install

      - name: Setup Python environment (CPU only)
        run: npm run setup-python-cpu

      - name: Install Python script dependencies
        run: pip install tqdm

      - name: Update version
        run: npm run update-version

      # Build steps run individually so we can use --no-bundle.
      # NSIS cannot handle _internal (~2 GB) — mmap limit.
      - name: Build Python backend
        run: npm run build-python

      - name: Build frontend
        run: npm run vite-build

      - name: Build Tauri binary (skip bundling)
        run: npx tauri build --no-bundle

      - name: Assemble portable files
        shell: pwsh
        run: |
          $target = "src-tauri\target\release"
          $bin = "src-tauri\bin"
          # Ensure sidecar is at expected path for zip.py
          if (-not (Test-Path "$target\VRCT-sidecar.exe")) {
            $sidecar = Get-ChildItem "$bin\VRCT-sidecar-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($sidecar) {
              Copy-Item $sidecar.FullName "$target\VRCT-sidecar.exe"
              Write-Host "Copied sidecar from $($sidecar.FullName)"
            }
          }
          # Ensure _internal is at expected path for zip.py
          if (-not (Test-Path "$target\_internal")) {
            if (Test-Path "$bin\_internal") {
              Copy-Item -Recurse "$bin\_internal" "$target\_internal"
              Write-Host "Copied _internal from $bin\_internal"
            }
          }
          # Verify files exist
          $vrct = Test-Path "$target\VRCT.exe"
          $sc = Test-Path "$target\VRCT-sidecar.exe"
          $int = Test-Path "$target\_internal"
          Write-Host "VRCT.exe: $vrct | Sidecar: $sc | _internal: $int"
          if (-not $vrct) { Write-Error "VRCT.exe not found!"; exit 1 }

      # Use 7z for better compression
      - name: Create portable archive
        shell: pwsh
        run: |
          $target = "src-tauri\target\release"
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=7 -m0=LZMA2 VRCT.7z `
            "$target\VRCT.exe" "$target\VRCT-sidecar.exe"
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=7 -m0=LZMA2 VRCT.7z `
            "$target\_internal"
          $size = (Get-Item VRCT.7z).Length / 1MB
          Write-Host "Standard archive size: $([math]::Round($size, 1)) MB"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-standard
          path: VRCT.7z
          retention-days: 7

# ─── Job 3: CUDA build (runs in parallel with Job 2) ─────────────────────────
  build-cuda:
    name: Build CUDA
    needs: get-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync package.json version from tag
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "${{ env.VERSION }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pip (CUDA)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-cuda-${{ hashFiles('requirements_cuda.txt') }}
          restore-keys: pip-cuda-

      - name: Install Node dependencies
        run: npm install

      - name: Setup Python environment (CUDA only)
        run: npm run setup-python-cuda

      - name: Install Python script dependencies
        run: pip install tqdm

      - name: Update version
        run: npm run update-version

      # Build steps run individually so we can use --no-bundle.
      # NSIS cannot handle CUDA _internal — far exceeds 2 GB mmap limit.
      - name: Build Python backend (CUDA)
        run: npm run build-python-cuda

      - name: Build frontend
        run: npm run vite-build

      - name: Build Tauri binary (skip bundling)
        run: npx tauri build --no-bundle

      - name: Assemble portable files
        shell: pwsh
        run: |
          $target = "src-tauri\target\release"
          $bin = "src-tauri\bin"
          if (-not (Test-Path "$target\VRCT-sidecar.exe")) {
            $sidecar = Get-ChildItem "$bin\VRCT-sidecar-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($sidecar) {
              Copy-Item $sidecar.FullName "$target\VRCT-sidecar.exe"
              Write-Host "Copied sidecar from $($sidecar.FullName)"
            }
          }
          if (-not (Test-Path "$target\_internal")) {
            if (Test-Path "$bin\_internal") {
              Copy-Item -Recurse "$bin\_internal" "$target\_internal"
              Write-Host "Copied _internal from $bin\_internal"
            }
          }
          $vrct = Test-Path "$target\VRCT.exe"
          $sc = Test-Path "$target\VRCT-sidecar.exe"
          $int = Test-Path "$target\_internal"
          Write-Host "VRCT.exe: $vrct | Sidecar: $sc | _internal: $int"
          if (-not $vrct) { Write-Error "VRCT.exe not found!"; exit 1 }

      # Use 7z for CUDA — standard zip exceeds GitHub's 2GB upload limit
      - name: Create CUDA archive (7z for compression)
        shell: pwsh
        run: |
          $target = "src-tauri\target\release"
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=7 -m0=LZMA2 VRCT_cuda.7z `
            "$target\VRCT.exe" "$target\VRCT-sidecar.exe"
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=7 -m0=LZMA2 VRCT_cuda.7z `
            "$target\_internal"
          $size = (Get-Item VRCT_cuda.7z).Length / 1MB
          Write-Host "CUDA archive size: $([math]::Round($size, 1)) MB"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-cuda
          path: VRCT_cuda.7z
          retention-days: 7

# ─── Job 4: create GitHub Release (tag push only) ────────────────────────────
  release:
    name: Create GitHub Release
    needs: [get-version, build-standard, build-cuda]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - name: Download standard artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-standard
          path: artifacts/standard

      - name: Download CUDA artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-cuda
          path: artifacts/cuda

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/standard/VRCT.7z
            artifacts/cuda/VRCT_cuda.7z
